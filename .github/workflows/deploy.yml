# Деплой на боевой сервер
name: Deploy to production

# Запуск при пуше в master или создании PR
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  # Проверка качества кода
  quality:
    runs-on: ubuntu-latest
    steps:
      # Скачиваем код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # Устанавливаем PHP с нужными расширениями
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, mysqli, curl, json, xml
          tools: phpcs

      # Проверяем синтаксис всех PHP файлов в папке local
      - name: PHP syntax check
        run: |
          find ./local -type f -name "*.php" -exec php -l {} \;
          echo "Syntax check passed"

      # Проверяем стиль кода по стандарту PSR-12
      - name: PHP Code Style (PSR-12)
        run: |
          phpcs --standard=PSR12 ./local || true
          echo "Code style check completed"

  # Деплой на боевой сервер (через self-hosted runner)
  deploy:
    runs-on: self-hosted
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      # Скачиваем код
      - name: Checkout code
        uses: actions/checkout@v4

      # Обновляем код на сервере
      - name: Deploy
        run: |
          cd /home/bitrix/www
          git fetch origin master
          git reset --hard origin/master