# Деплой на боевой сервер
name: Deploy to production

# Запускается при пуше в dev или master
on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ master ]

jobs:

  # Проверка качества кода
  quality:
    runs-on: ubuntu-latest
    steps:
      # Скачиваем код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # Устанавливаем PHP и расширения для проверок
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, mysqli, curl, json, xml
          tools: phpcs

      # Проверяем синтаксис
      - name: PHP syntax check
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM origin/master...HEAD)
          if [ -n "$CHANGED_FILES" ]; then
            for file in $CHANGED_FILES; do
              if [[ $file == *.php ]]; then
                php -l $file || exit 1
              fi
            done
            echo "All changed PHP files are valid"
          else
            echo "No changed PHP files found"
          fi

      # Проверяем стиль кода PSR-12
      - name: PHP Code Style (PSR-12)
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM origin/master...HEAD | grep '\.php$' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "$CHANGED_FILES" | xargs phpcs --standard=PSR12 || true
            echo "Code style check completed"
          else
            echo "No PHP files to check"
          fi

  # Деплой на боевой сервер
  deploy:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /home/bitrix/www
            git fetch origin master
            git reset --hard origin/master
