name: Auto create PR from dev to master

on:
  push:
    branches: [ dev ]

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR using GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const owner = 'FORUM-ELECTRO';
            const repo = 'BITRIX_FE_2026-02';
            const head = 'dev';
            const base = 'master';

            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${head}`,
              base,
              state: 'open'
            });

            if (pulls.length > 0) {
              console.log(`PR уже существует: ${pulls[0].html_url}`);
              return;
            }

            const { data: pull } = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base,
              title: 'Авто PR: изменения из dev',
              body: 'Автоматически созданный PR. Проверьте и подтвердите вливание.'
            });

            console.log(`PR создан: ${pull.html_url}`);