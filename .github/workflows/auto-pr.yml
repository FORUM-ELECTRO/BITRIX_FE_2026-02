name: Auto create PR from dev to master

on:
  push:
    branches: [ dev ]

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: dev
          base: master
          title: "Авто PR: изменения из dev"
          body: |
            Автоматически созданный PR.
            Проверьте и подтвердите вливание.
          labels: automated-pr