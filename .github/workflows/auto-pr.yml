name: Auto create PR from dev to master

on:
  push:
    branches: [ dev ]

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: FORUM-ELECTRO/BITRIX_FE_2026-02
          branch: dev
          base: master
          title: "Авто PR: изменения из dev"
          body: |
            Автоматически созданный PR.
            Проверьте и подтвердите вливание.
          labels: automated-pr
